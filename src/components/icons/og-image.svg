<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGradient" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c131d"/>
      <stop offset="50%" stop-color="#120c13"/>
      <stop offset="100%" stop-color="#080509"/>
    </radialGradient>

    <radialGradient id="foodSpotlight" cx="28%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF3D00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="50%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#E6003A"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#2A242B"/>
      <stop offset="95%" stop-color="#1A141C"/>
      <stop offset="100%" stop-color="#3D3340"/>
    </radialGradient>

    <radialGradient id="puriGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#E6A15C"/>
      <stop offset="85%" stop-color="#B86D29"/>
      <stop offset="100%" stop-color="#8A4B16"/>
    </radialGradient>

    <radialGradient id="mintGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="70%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>

    <radialGradient id="tamarindGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="70%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF6B00" flood-opacity="0.5"/>
    </filter>

    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#ffffff" opacity="0.03"/>
      <circle cx="35" cy="55" r="1.2" fill="#ffffff" opacity="0.02"/>
      <circle cx="70" cy="25" r="0.8" fill="#ffffff" opacity="0.04"/>
      <circle cx="85" cy="80" r="1" fill="#ffffff" opacity="0.02"/>
      <circle cx="45" cy="90" r="0.9" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <circle cx="340" cy="340" r="380" fill="url(#foodSpotlight)"/>

  <path d="M0,150 Q600,120 1200,180 M0,480 Q600,450 1200,500" stroke="#FF6B00" stroke-opacity="0.05" stroke-width="1.5" fill="none"/>
